<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Pong</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: monospace; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; user-select: none; }
        #score { font-size: 48px; font-weight: bold; }
        #message { font-size: 24px; margin-top: 10px; color: #aaa; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="timer" style="font-size: 24px; color: #00ffcc; margin-bottom: 40px;">00:00</div>
        <div id="score">0 : 0</div>
        <div id="message">Нажми Пробел, чтобы начать</div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
