<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Pong</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: monospace; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; user-select: none; z-index: 10; }
        #score { font-size: 48px; font-weight: bold; }
        #message { font-size: 24px; margin-top: 10px; color: #aaa; }
        
        /* Стили для главного меню */
        #main-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            font-family: monospace;
        }
        #main-menu h1 { font-size: 64px; margin-bottom: 40px; color: #fff; }
        .menu-btn {
            background: #222;
            color: #fff;
            border: 2px solid #555;
            padding: 15px 30px;
            margin: 10px;
            font-size: 20px;
            font-family: monospace;
            cursor: pointer;
            transition: 0.2s;
            width: 300px;
        }
        .menu-btn:hover { background: #444; border-color: #fff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Экран меню -->
    <div id="main-menu">
        <h1>PONG</h1>
        <button class="menu-btn" id="btn-pve">Играть с ИИ (1P)</button>
        <button class="menu-btn" id="btn-pvp">Играть на двоих (2P)</button>
    </div>

    <!-- Игровой интерфейс -->
    <div id="ui" class="hidden">
        <div id="timer" style="font-size: 24px; color: #00ffcc; margin-bottom: 40px;">00:00</div>
        <div id="score">0 : 0</div>
        <div id="message">Нажми Пробел, чтобы начать</div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
